<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自用导航 - 四个复制按钮</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(145deg, #f8faff 0%, #eef2f9 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 24px;
    padding: 40px 32px;
    box-shadow: 0 25px 40px -12px rgba(0, 20, 60, 0.25),
                inset 0 1px 2px rgba(255, 255, 255, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    max-width: 480px;
    width: 100%;
  }

  .title {
    font-size: 24px;
    font-weight: 600;
    color: #1f2a4a;
    text-align: center;
  }

  .title span {
    background: linear-gradient(135deg, #3b5bdb, #8b5cf6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub {
    font-size: 15px;
    color: #4b587c;
    text-align: center;
    margin-top: -8px;
  }

  /* 竖排容器 */
  .btn-grid {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    margin-top: 8px;
  }

  .btn-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 100%;
  }

  .url-display {
    width: 100%;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 40px;
    padding: 9px 14px;
    font-size: 12px;
    color: #1e2b4f;
    border: 1px solid #d9e2f0;
    text-align: center;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  }

  .copy-btn {
    border: none;
    outline: none;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 14px;
    border-radius: 60px;
    background: #1a2b4c;
    color: #fff;
    font-weight: 500;
    font-size: 15px;
    white-space: nowrap;
    width: 100%;
    box-shadow: 0 8px 18px -6px rgba(26, 43, 76, 0.4),
                0 2px 6px rgba(26, 43, 76, 0.1),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
    transition: background 0.25s ease, transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .copy-btn:hover { background: #233a62; transform: translateY(-1px); }
  .copy-btn:active { transform: translateY(1px); background: #16233d; }

  .copy-btn svg {
    width: 16px; height: 16px; flex-shrink: 0;
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }

  .copy-btn.copied {
    background: #2b6e4f;
    box-shadow: 0 8px 18px -6px rgba(43, 110, 79, 0.5);
  }
  .copy-btn.copied:hover { background: #2f7a58; }

  /* Toast */
  .toast-message {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: #1e293b;
    color: #f1f5f9;
    padding: 13px 32px;
    border-radius: 60px;
    font-size: 15px;
    font-weight: 500;
    box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.4);
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.25s ease;
    pointer-events: none;
    z-index: 9999;
    white-space: nowrap;
  }
  .toast-message.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 480px) {
    .card { padding: 28px 18px; gap: 18px; }
    .copy-btn { padding: 11px 12px; font-size: 14px; gap: 6px; }
    .copy-btn svg { width: 14px; height: 14px; }
    .url-display { padding: 7px 10px; font-size: 10px; }
    .title { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="title"><span>自用导航</span> 链接集合</div>
  <p class="sub">点击任意按钮复制专属导航地址</p>

  <div class="btn-grid" id="btnGrid">
    <!-- 按钮 1 -->
    <div class="btn-item">
      <div class="url-display">lt3611.ccwu.cc</div>
      <button class="copy-btn" data-copy="http://lt3611.ccwu.cc/" aria-label="复制自用导航链接">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        <span class="btn-text">自用导航</span>
      </button>
    </div>
    <!-- 按钮 2 -->
    <div class="btn-item">
      <div class="url-display">lt3611.ccwu.cc</div>
      <button class="copy-btn" data-copy="http://lt3611.ccwu.cc/" aria-label="复制自用导航链接">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        <span class="btn-text">自用导航</span>
      </button>
    </div>
    <!-- 按钮 3 -->
    <div class="btn-item">
      <div class="url-display">lt3611.ccwu.cc</div>
      <button class="copy-btn" data-copy="http://lt3611.ccwu.cc/" aria-label="复制自用导航链接">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        <span class="btn-text">自用导航</span>
      </button>
    </div>
    <!-- 按钮 4 -->
    <div class="btn-item">
      <div class="url-display">lt3611.ccwu.cc</div>
      <button class="copy-btn" data-copy="http://lt3611.ccwu.cc/" aria-label="复制自用导航链接">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        <span class="btn-text">自用导航</span>
      </button>
    </div>
  </div>
</div>

<div class="toast-message" id="toast">✅ 自用导航链接已复制</div>

<script>
(function () {
  'use strict';

  var DEFAULT_BTN_TEXT = '自用导航';
  var toastEl = document.getElementById('toast');
  var copyBtns = document.querySelectorAll('.copy-btn');
  var toastTimer = null;

  function showToast(message, duration) {
    if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
    toastEl.textContent = message;
    toastEl.classList.add('show');
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
      toastTimer = null;
    }, duration || 2000);
  }

  function fallbackCopy(text) {
    return new Promise(function (resolve) {
      var textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.top = '-9999px';
      textarea.style.left = '-9999px';
      textarea.style.opacity = '0';
      textarea.setAttribute('readonly', '');
      document.body.appendChild(textarea);
      textarea.select();
      textarea.setSelectionRange(0, textarea.value.length);
      var success = false;
      try { success = document.execCommand('copy'); } catch (e) { success = false; }
      document.body.removeChild(textarea);
      resolve(success);
    });
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () {
        return true;
      }).catch(function () {
        return fallbackCopy(text);
      });
    }
    return fallbackCopy(text);
  }

  copyBtns.forEach(function (btn) {
    var btnText = btn.querySelector('.btn-text');
    var restoreTimer = null;
    var failTimer = null;

    btn.addEventListener('click', function () {
      var textToCopy = btn.getAttribute('data-copy') || 'http://lt3611.ccwu.cc/';

      btn.disabled = true;
      btn.style.opacity = '0.8';

      copyText(textToCopy).then(function (success) {
        if (success) {
          btn.classList.add('copied');
          btnText.textContent = '已复制!';
          showToast('✅ 自用导航链接已复制', 2000);

          if (restoreTimer) clearTimeout(restoreTimer);
          restoreTimer = setTimeout(function () {
            btnText.textContent = DEFAULT_BTN_TEXT;
            btn.classList.remove('copied');
            restoreTimer = null;
          }, 2000);
        } else {
          showToast('❌ 复制失败，请手动复制', 2500);
          btnText.textContent = '复制失败';
          if (failTimer) clearTimeout(failTimer);
          failTimer = setTimeout(function () {
            btnText.textContent = DEFAULT_BTN_TEXT;
            failTimer = null;
          }, 2000);
        }
      }).catch(function () {
        showToast('❌ 复制失败，请稍后重试', 2000);
        btnText.textContent = DEFAULT_BTN_TEXT;
      }).finally(function () {
        btn.disabled = false;
        btn.style.opacity = '1';
      });
    });
  });
})();
</script>

</body>
</html>
