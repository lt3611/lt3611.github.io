<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宁陵县天气 & 倒计时日历</title>
    <!-- 引入农历计算库 -->
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.js"></script>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --primary-color: #3b82f6;
            --weekend-color: #ef4444;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 天气卡片 */
        .weather-card {
            background: linear-gradient(135deg, #ffffff 0%, #f3f8ff 100%);
            border-radius: 20px;
            padding: 20px 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        .weather-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .weather-icon {
            font-size: 52px;
            line-height: 1;
        }

        .weather-temp {
            font-size: 48px;
            font-weight: bold;
            color: var(--text-main);
            line-height: 1;
            font-family: "DIN Alternate", "Helvetica Neue", sans-serif;
        }

        .weather-temp span {
            font-size: 20px;
            vertical-align: top;
        }

        .weather-right {
            text-align: right;
        }

        .weather-right h3 {
            font-size: 18px;
            color: var(--text-main);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .weather-right .desc {
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.4;
        }

        /* 倒计时与阴历卡片 */
        .summary-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        .lunar-area {
            text-align: left;
            flex: 1;
        }

        .lunar-area .solar-date {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .lunar-area .lunar-date {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .lunar-area .ganzhi-date {
            font-size: 12px;
            color: var(--text-sub);
            letter-spacing: 0.5px;
        }

        .countdown-area {
            text-align: right;
            padding-left: 15px;
            border-left: 1px dashed var(--border-color);
            min-width: 110px;
        }

        .countdown-label {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .countdown-val {
            display: flex;
            align-items: baseline;
            justify-content: flex-end;
            color: var(--primary-color);
        }

        .countdown-number {
            font-size: 34px;
            font-weight: 800;
            line-height: 1;
            font-family: "DIN Alternate", "Helvetica Neue", sans-serif;
        }

        .countdown-unit {
            font-size: 14px;
            margin-left: 4px;
            font-weight: bold;
        }

        /* 日历卡片 */
        .calendar-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header h2 {
            font-size: 20px;
            color: var(--text-main);
            font-weight: 600;
        }

        .btn-group button {
            background: none;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-main);
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn-group button:hover {
            background: #f9fafb;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 10px;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            row-gap: 5px;
        }

        .day-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 52px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            border: 1.5px solid transparent;
            position: relative;
        }

        .day-cell:hover {
            background-color: #f3f4f6;
        }

        .day-cell .solar {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-main);
        }

        .day-cell .lunar {
            font-size: 10px;
            color: var(--text-sub);
            margin-top: 2px;
            transform: scale(0.95);
        }

        .day-cell.other-month .solar,
        .day-cell.other-month .lunar {
            color: #d1d5db;
        }

        .day-cell.weekend .solar {
            color: var(--weekend-color);
        }

        .day-cell.today .solar,
        .day-cell.today .lunar {
            color: var(--primary-color);
            font-weight: bold;
        }

        .day-cell.selected {
            background-color: var(--primary-color);
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
        }
        .day-cell.selected .solar,
        .day-cell.selected .lunar {
            color: #fff;
        }

        .day-cell .lunar.festival {
            color: var(--weekend-color);
        }
        .day-cell.selected .lunar.festival {
            color: #fff;
        }

        /* ================= 历史上的今天 气泡提示样式 ================= */
        .history-popover {
            position: absolute;
            z-index: 100;
            background-color: #1e293b;
            color: #ffffff;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;

            width: max-content;
            max-width: 260px; /* 限制最大宽度，防止过宽 */
            word-break: break-word;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.15s, transform 0.15s;
            transform: translateY(4px);
            pointer-events: none;
        }

        .history-popover.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* 气泡小三角 (通过 CSS 变量控制横向位置) */
        .history-popover::after {
            content: '';
            position: absolute;
            top: 100%;
            left: var(--arrow-left, 50%); /* 默认居中，由JS动态覆盖 */
            margin-left: -6px;
            border-width: 6px;
            border-style: solid;
            border-color: #1e293b transparent transparent transparent;
        }

        /* 如果在顶部第一行则气泡放在下方 */
        .history-popover.bottom-arrow::after {
            top: auto;
            bottom: 100%;
            border-color: transparent transparent #1e293b transparent;
        }

            font-weight: bold;

            font-weight: 600;
            flex-shrink: 0;
            font-family: "DIN Alternate", monospace;

<script>
    /* ================= 1. 倒计时逻辑 ================= */
    function updateCountdown() {
        const now = new Date();
        let targetYear = now.getFullYear() + 1;
        const targetDate = new Date(targetYear, 0, 1, 0, 0, 0); 
        
        const diffTime = targetDate - now;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        
        document.getElementById('countdown-days').innerText = diffDays;
    }

    /* ================= 2. 天气获取 ================= */
    async function fetchWeather() {
        try {
            const response = await fetch('https://api.vvhan.com/api/weather?city=宁陵县');
            const data = await response.json();
            if(data.success && data.info) {
                const info = data.info;
                document.getElementById('temp').innerText = info.tem;
                document.getElementById('weather-desc').innerHTML = `${info.weather}<br>${info.wind} ${info.winp}`;
                
                let icon = "🌤️";
                if (info.weather.includes("晴")) icon = "☀️";
                else if (info.weather.includes("云") || info.weather.includes("阴")) icon = "☁️";
                else if (info.weather.includes("雨")) icon = "🌧️";
                else if (info.weather.includes("雪")) icon = "❄️";
                document.getElementById('weather-icon').innerText = icon;
            } else {
                showWeatherFallback();
            }
        } catch (error) {
            showWeatherFallback();
        }
    }

    function showWeatherFallback() {
        document.getElementById('temp').innerText = '--';
        document.getElementById('weather-desc').innerHTML = '网络超时<br>请稍后刷新';
        document.getElementById('weather-icon').innerText = '⛅';
    }

    /* ================= 4. 日历渲染与交互 ================= */
    let currentDate = new Date(); 
    let selectedDate = new Date(); 
    let activeCell = null; 

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth(); 
        document.getElementById('year-month').innerText = `${year}年${month + 1}月`;

        const daysContainer = document.getElementById('calendar-days');
        daysContainer.innerHTML = ''; 

        hidePopover(); // 重新渲染时隐藏气泡

        const firstDay = new Date(year, month, 1).getDay();
        const startOffset = firstDay === 0 ? 6 : firstDay - 1; 
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const daysInPrevMonth = new Date(year, month, 0).getDate();

        const isSelected = (dateObj) => {
            return dateObj.getFullYear() === selectedDate.getFullYear() &&
                   dateObj.getMonth() === selectedDate.getMonth() &&
                   dateObj.getDate() === selectedDate.getDate();
        };

        // 上个月
        for (let i = startOffset - 1; i >= 0; i--) {
            const dateNum = daysInPrevMonth - i;
            const dateObj = new Date(year, month - 1, dateNum);
            daysContainer.appendChild(createDayCell(dateObj, dateNum, true, isSelected(dateObj)));
        }

        // 当月
        for (let i = 1; i <= daysInMonth; i++) {
            const dateObj = new Date(year, month, i);
            daysContainer.appendChild(createDayCell(dateObj, i, false, isSelected(dateObj)));
        }

        // 下个月
        const totalCells = startOffset + daysInMonth;
        const nextMonthCells = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
        const extraCells = totalCells + nextMonthCells < 42 ? 7 : 0; 
        
        for (let i = 1; i <= nextMonthCells + extraCells; i++) {
            const dateObj = new Date(year, month + 1, i);
            daysContainer.appendChild(createDayCell(dateObj, i, true, isSelected(dateObj)));
        }
    }

    function createDayCell(dateObj, dateNum, isOtherMonth, isSelected) {
        const cell = document.createElement('div');
        cell.className = 'day-cell';
        
        if (isOtherMonth) cell.classList.add('other-month');
        if (isSelected) cell.classList.add('selected');

        const dayOfWeek = dateObj.getDay();
        if (dayOfWeek === 0 || dayOfWeek === 6) cell.classList.add('weekend');

        let lunarText = '';
        let isFestival = false;
        try {
            const lunar = Lunar.fromDate(dateObj);
            if (lunar.getFestivals().length > 0) {
                lunarText = lunar.getFestivals()[0];
                isFestival = true;
            } else if (lunar.getJieQi()) {
                lunarText = lunar.getJieQi();
                isFestival = true;
            } else {
                lunarText = lunar.getDayInChinese();
            }
        } catch (e) {}

        cell.innerHTML = `
            <span class="solar">${dateNum}</span>
            <span class="lunar ${isFestival ? 'festival' : ''}">${lunarText}</span>
        `;

        cell.onclick = (e) => {
            e.stopPropagation();
            selectedDate = dateObj;
            if (isOtherMonth) {
                currentDate = new Date(dateObj.getFullYear(), dateObj.getMonth(), 1);
                renderCalendar(); 
                setTimeout(() => showPopoverForDate(dateObj), 10);
                return;
            }
            renderCalendar();
            updateDetailBox(dateObj);
            showPopoverForDate(dateObj, cell);
        };

        return cell;
    }

    /* ================= 5. 气泡控制逻辑 (智能防溢出) ================= */
    function showPopoverForDate(dateObj, cellElement = null) {
        const month = dateObj.getMonth() + 1;
        const day = dateObj.getDate();
        
        // 只处理10月份的数据
        if (month !== 10) {
            hidePopover();
            return;
        }

        const events = HISTORY_DATA[day];
        if (!events || events.length === 0) {
            hidePopover();
            return;
        }

        if (!cellElement) {
            const allCells = document.querySelectorAll('.day-cell');
            for (let c of allCells) {
                if (c.querySelector('.solar').innerText == day && !c.classList.contains('other-month')) {
                    cellElement = c;
                    break;
                }
            }
        }

        if (!cellElement) return;

        const popover = document.getElementById('history-popover');
        const title = document.getElementById('popover-title');
        const list = document.getElementById('popover-list');

        title.innerText = `历史上的今天 · ${month}月${day}日`;
        list.innerHTML = '';
        
        events.forEach(item => {
            const li = document.createElement('li');
            li.innerHTML = `<span class="popover-year">${item.year}</span><span>${item.event}</span>`;
            list.appendChild(li);
        });

        // 显示气泡以获取准确宽度
        popover.classList.add('show');
        
        const cardRect = document.getElementById('calendar-card').getBoundingClientRect();
        const cellRect = cellElement.getBoundingClientRect();
        
        const popWidth = popover.offsetWidth;
        const cardWidth = cardRect.width;
        const margin = 15; // 距离卡片边缘的安全距离

        // 1. 计算水平位置 (防止左右溢出)
        const cellCenterX = cellRect.left - cardRect.left + cellRect.width / 2;
        let left = cellCenterX - popWidth / 2;

        // 左侧边界限制
        if (left < margin) {
            left = margin;
        }
        // 右侧边界限制
        if (left + popWidth > cardWidth - margin) {
            left = cardWidth - margin - popWidth;
        }

        // 2. 计算小箭头位置 (确保箭头精准指向日期格子)
        let arrowLeft = cellCenterX - left;
        // 限制箭头不要超出气泡的圆角范围
        if (arrowLeft < 15) arrowLeft = 15;
        if (arrowLeft > popWidth - 15) arrowLeft = popWidth - 15;

        popover.style.left = `${left}px`;
        // 通过 CSS 变量动态设置小三角的位置
        popover.style.setProperty('--arrow-left', `${arrowLeft}px`);

        // 3. 计算垂直位置 (防止上下溢出)
        let top = cellRect.top - cardRect.top - popover.offsetHeight - 10;
        let isBottom = false;

        if (top < 10) {
            // 顶部空间不足，将气泡放到格子下方
            top = cellRect.top - cardRect.top + cellRect.height + 10;
            isBottom = true;
        }

        popover.style.top = `${top}px`;

        if (isBottom) {
            popover.classList.add('bottom-arrow');
        } else {
            popover.classList.remove('bottom-arrow');
        }
        
        activeCell = cellElement;
    }

    function hidePopover() {
        const popover = document.getElementById('history-popover');
        popover.classList.remove('show');
        activeCell = null;
    }

    document.addEventListener('click', (e) => {
        const popover = document.getElementById('history-popover');
        if (popover.classList.contains('show')) {
            if (!popover.contains(e.target) && e.target !== activeCell && !activeCell?.contains(e.target)) {
                hidePopover();
            }
        }
    });

    /* ================= 6. 更新阴历详情 ================= */
    function updateDetailBox(dateObj) {
        document.getElementById('detail-solar').innerText = 
            `${dateObj.getFullYear()}年${dateObj.getMonth() + 1}月${dateObj.getDate()}日 星期${['日','一','二','三','四','五','六'][dateObj.getDay()]}`;

        try {
            const lunar = Lunar.fromDate(dateObj);
            const lunarMonth = lunar.getMonthInChinese();
            const lunarDay = lunar.getDayInChinese();
            
            document.getElementById('detail-lunar').innerText = `农历 ${lunarMonth}月${lunarDay}`;
            
            const ganZhiYear = lunar.getYearInGanZhi();
            const zodiac = lunar.getYearShengXiao();
            const ganZhiMonth = lunar.getMonthInGanZhi();
            const ganZhiDay = lunar.getDayInGanZhi();

            document.getElementById('detail-ganzhi').innerText = 
                `${ganZhiYear} [${zodiac}] 年 ${ganZhiMonth}月 ${ganZhiDay}日`;
        } catch (e) {
            document.getElementById('detail-lunar').innerText = '农历信息获取失败';
        }
    }

    /* ================= 7. 交互控制 ================= */
    function changeMonth(offset) {
        currentDate.setMonth(currentDate.getMonth() + offset);
        renderCalendar();
    }

    function goToToday() {
        currentDate = new Date();
        selectedDate = new Date();
        renderCalendar();
        updateDetailBox(selectedDate);
        if (selectedDate.getMonth() === 9) {
            setTimeout(() => showPopoverForDate(selectedDate), 50);
        }
    }

    // 初始化
    window.onload = () => {
        fetchWeather();
        updateCountdown();
        
        // 指定打开时显示的日期
        currentDate = new Date(2026, 9, 1);
        selectedDate = new Date(2026, 9, 28);

        renderCalendar();
        updateDetailBox(selectedDate); 
        
        setInterval(() => {
            fetchWeather();
            updateCountdown();
        }, 600000);
    };

</script>
