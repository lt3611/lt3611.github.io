<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A3 → A4 批量分割器 · 自动分割 · 打印</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      background: #f5f7fc;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      display: flex; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .card {
      background: #fff; max-width: 1100px; width: 100%;
      border-radius: 32px; box-shadow: 0 20px 40px -12px rgba(0,20,40,.25);
      padding: 32px 36px;
    }
    h1 {
      font-size: 1.9rem; font-weight: 600; letter-spacing: -.01em;
      color: #0b1e33; display: flex; align-items: center;
      gap: 10px; margin-bottom: 8px; flex-wrap: wrap;
    }
    h1 span {
      background: #d0e2ff; border-radius: 100px; padding: 6px 14px;
      font-size: .9rem; font-weight: 500; color: #0052b3;
    }
    .subhead {
      color: #4f5f6f; margin-bottom: 24px; font-size: 1rem;
      border-left: 4px solid #2d7aff; padding: 12px 20px;
      background: #f0f6ff; border-radius: 0 12px 12px 0; line-height: 1.5;
    }
    .upload-area {
      border: 2.5px dashed #b8cef0; border-radius: 24px;
      background: #fafdff; padding: 28px 20px; text-align: center;
      cursor: pointer; transition: all .15s; margin-bottom: 24px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .upload-area:hover { border-color: #2d7aff; background: #f2f9ff; }
    .upload-area.dragover {
      border-color: #1a5fd0; background: #e3f0ff; transform: scale(1.01);
    }
    .upload-area input[type="file"] { display: none; }
    .upload-icon { font-size: 2.6rem; line-height: 1; }
    .upload-text { font-weight: 500; color: #0b2b4a; font-size: 1.15rem; }
    .upload-hint {
      font-size: .85rem; color: #6d7e91; background: #ecf3fb;
      padding: 4px 14px; border-radius: 40px;
    }
    .toolbar {
      display: flex; flex-wrap: wrap; align-items: center;
      justify-content: space-between; gap: 12px; margin-bottom: 20px;
    }
    .toolbar-left {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      color: #1c3b5e; font-weight: 500; font-size: .95rem;
    }
    .count-badge {
      background: #d4e4ff; padding: 6px 14px; border-radius: 40px;
      font-size: .8rem; font-weight: 600; color: #004cbf;
    }
    .btn {
      border: none; background: #1a5fd0; color: #fff; font-weight: 600;
      padding: 10px 22px; border-radius: 60px; font-size: .95rem;
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; cursor: pointer; transition: all .15s;
      box-shadow: 0 4px 10px rgba(26,95,208,.25); letter-spacing: .3px;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) {
      background: #1048a8; box-shadow: 0 8px 16px rgba(26,95,208,.3);
      transform: translateY(-1px);
    }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled {
      background: #a6bbd9; box-shadow: none; cursor: not-allowed; opacity: .65;
    }
    .btn-outline {
      background: #fff; color: #1a5fd0; border: 1.5px solid #1a5fd0;
      box-shadow: none;
    }
    .btn-outline:hover:not(:disabled) { background: #e9f1ff; color: #0e44a0; }
    .btn-sm { padding: 7px 16px; font-size: .85rem; }
    .btn-danger-outline {
      background: #fff; color: #b13b3b; border: 1.5px solid #e0a0a0;
      box-shadow: none;
    }
    .btn-danger-outline:hover:not(:disabled) { background: #ffeeee; }
    .btn-print {
      background: #1e7a1e; box-shadow: 0 4px 10px rgba(30,122,30,.25);
    }
    .btn-print:hover:not(:disabled) {
      background: #145014; box-shadow: 0 8px 16px rgba(30,122,30,.3);
    }
    .btn-group { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

    .file-list { display: flex; flex-direction: column; gap: 20px; }

    .file-card {
      background: #fff; border-radius: 22px; padding: 18px 20px;
      border: 1px solid #e3ecf8; box-shadow: 0 6px 16px -8px rgba(0,30,60,.12);
      transition: all .15s;
    }
    .file-card:hover { border-color: #b6d0f0; }
    .file-card-head {
      display: flex; flex-wrap: wrap; align-items: center;
      justify-content: space-between; gap: 12px; margin-bottom: 14px;
    }
    .file-meta {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      color: #1c3b5e; font-weight: 500; min-width: 0;
    }
    .file-meta .badge {
      background: #d4e4ff; padding: 5px 12px; border-radius: 40px;
      font-size: .75rem; font-weight: 600; color: #004cbf; flex-shrink: 0;
    }
    .file-name {
      max-width: 340px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; font-size: .95rem;
    }
    .file-size { color: #5e7a9c; font-weight: 400; font-size: .82rem; }
    .file-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .preview-grid {
      display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;
    }
    .preview-card {
      flex: 1 1 240px; max-width: 320px;
      background: #fbfdff; border-radius: 16px; padding: 12px;
      border: 1px solid #e3ecf8; display: flex; flex-direction: column;
    }
    .preview-title {
      font-weight: 600; font-size: .9rem; margin-bottom: 10px; color: #0c2d4b;
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
    }
    .preview-title .dim {
      font-weight: 400; font-size: .72rem; color: #627d9b;
      background: #ecf3fb; padding: 2px 10px; border-radius: 30px;
      white-space: nowrap;
    }
    .preview-img {
      width: 100%; border-radius: 10px; background: #f4f8ff;
      display: flex; justify-content: center; align-items: center;
      overflow: hidden; border: 1px solid #d9e7fa; margin-bottom: 10px;
      min-height: 140px;
    }
    .preview-img img { display: block; width: 100%; height: auto; }
    .placeholder-img {
      width: 100%; aspect-ratio: 1/1.414; background: #f3f9ff;
      display: flex; align-items: center; justify-content: center;
      color: #7c94b0; font-size: .85rem; border-radius: 10px;
      flex-direction: column; gap: 8px; padding: 14px; text-align: center;
      border: 1px dashed #b9d2f0;
    }
    .placeholder-img span { font-size: 1.7rem; opacity: .7; }
    .card-status {
      font-size: .78rem; color: #7a8fa8; display: flex; align-items: center;
      gap: 6px; margin-top: 4px;
    }
    .spinner {
      width: 16px; height: 16px; border: 2.5px solid #d0e2ff;
      border-top: 2.5px solid #1a5fd0; border-radius: 50%;
      animation: spin .8s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
    .empty-state {
      text-align: center; color: #8ea5be; padding: 40px 20px;
      font-size: .95rem;
    }
    .footer-note {
      text-align: center; font-size: .85rem; color: #7a8fa8;
      margin-top: 24px; border-top: 1px solid #e0ecfa; padding-top: 20px;
    }
    .hidden { display: none !important; }
    .quality-tag {
      display: inline-block; background: #e6f7e6; color: #1e7a1e;
      padding: 2px 10px; border-radius: 30px; font-size: .7rem;
      font-weight: 600; margin-left: 6px; letter-spacing: .2px;
    }
    /* 打印样式：打印时只显示打印区域，隐藏其他 */
    @media print {
      body * {
        visibility: hidden;
      }
      #printArea, #printArea * {
        visibility: visible;
      }
      #printArea {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: #fff;
        padding: 0;
        margin: 0;
      }
      #printArea img {
        max-width: 100%;
        page-break-after: always;
        display: block;
      }
      #printArea .print-page {
        page-break-after: always;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100vh;
      }
      #printArea .print-page:last-child {
        page-break-after: auto;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>✂️ A3 → A4 <span>批量分割器</span></h1>
    <div class="subhead">
      批量上传图片或 PDF，<strong>自动分割</strong>为 A4 并输出高质量 JPG。支持打印、打包下载全部。
    </div>

    <!-- 上传区 -->
    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">📄</div>
      <div class="upload-text">点击或拖拽，支持多文件批量上传</div>
      <div class="upload-hint">JPG / PNG / WebP / PDF · 可多选 · 上传后自动分割</div>
      <input type="file" id="fileInput" multiple
             accept="image/jpeg,image/png,image/webp,image/jpg,application/pdf,.pdf">
    </div>

    <!-- 工具栏 -->
    <div class="toolbar" id="toolbar">
      <div class="toolbar-left">
        <span class="count-badge" id="fileCount">0 个文件</span>
        <span id="splitProgress"></span>
      </div>
      <div class="btn-group">
        <button class="btn btn-outline" id="downloadAllBtn" disabled>⬇️ 打包下载全部</button>
        <button class="btn btn-danger-outline btn-sm" id="clearAllBtn" disabled>🗑 清空全部</button>
      </div>
    </div>

    <!-- 文件列表 -->
    <div class="file-list" id="fileList">
      <div class="empty-state" id="emptyState">还没有文件，请上传 A3 图片或 PDF</div>
    </div>

    <div class="footer-note">
      ⚡ 全部处理在浏览器本地完成 · 不上传服务器 · JPG 质量 0.95
    </div>
  </div>

  <!-- 打印区域（隐藏） -->
  <div id="printArea" style="display:none;"></div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    (function(){
      // ========== 状态 ==========
      // 每个 item: { id, file, type, image?, pdfData?, status, result?, errorMsg? }
      // status: 'pending' | 'splitting' | 'done' | 'error'
      // 对于图片，result: { a4_1: {dataUrl, blob}, a4_2: {dataUrl, blob} }
      // 对于 PDF，result: { pages: [ {a4_1, a4_2}, ... ], pageCount }
      let items = [];
      let nextId = 1;

      // ========== DOM ==========
      const uploadArea = document.getElementById('uploadArea');
      const fileInput = document.getElementById('fileInput');
      const fileListEl = document.getElementById('fileList');
      const emptyState = document.getElementById('emptyState');
      const fileCountEl = document.getElementById('fileCount');
      const downloadAllBtn = document.getElementById('downloadAllBtn');
      const clearAllBtn = document.getElementById('clearAllBtn');
      const splitProgress = document.getElementById('splitProgress');
      const printArea = document.getElementById('printArea');

      // ========== 工具函数 ==========
      function canvasToJpg(canvas, quality = 0.95) {
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        const parts = dataUrl.split(',');
        const mime = parts[0].match(/:(.*?);/)[1];
        const bstr = atob(parts[1]);
        let n = bstr.length;
        const u8arr = new Uint8Array(n);
        while (n--) u8arr[n] = bstr.charCodeAt(n);
        const blob = new Blob([u8arr], { type: mime });
        return { dataUrl, blob };
      }

      function downloadBlob(blob, fileName) {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = fileName;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 3000);
      }

      function getOutName(item, suffix, ext) {
        const base = item.file.name.replace(/\.[^/.]+$/, '');
        return `${base}_A4_${suffix}.${ext}`;
      }

      function esc(s) {
        return String(s).replace(/[&<>"']/g, c =>
          ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      }

      function splitSourceToTwo(source, isLandscape) {
        const w = source.width || source.naturalWidth;
        const h = source.height || source.naturalHeight;
        const c1 = document.createElement('canvas');
        const c2 = document.createElement('canvas');
        if (isLandscape) {
          const aw = Math.floor(w / 2), ah = h;
          c1.width = aw; c1.height = ah; c2.width = aw; c2.height = ah;
          const x1 = c1.getContext('2d'), x2 = c2.getContext('2d');
          x1.drawImage(source, 0, 0, aw, ah, 0, 0, aw, ah);
          x2.drawImage(source, aw, 0, aw, ah, 0, 0, aw, ah);
        } else {
          const aw = w, ah = Math.floor(h / 2);
          c1.width = aw; c1.height = ah; c2.width = aw; c2.height = ah;
          const x1 = c1.getContext('2d'), x2 = c2.getContext('2d');
          x1.drawImage(source, 0, 0, aw, ah, 0, 0, aw, ah);
          x2.drawImage(source, 0, ah, aw, ah, 0, 0, aw, ah);
        }
        return { c1, c2 };
      }

      // ========== 渲染 ==========
      function render() {
        const total = items.length;
        fileCountEl.textContent = `${total} 个文件`;
        emptyState.classList.toggle('hidden', total !== 0);

        const anyDone = items.some(it => it.status === 'done');
        const anySplitting = items.some(it => it.status === 'splitting');
        downloadAllBtn.disabled = !anyDone || anySplitting;
        clearAllBtn.disabled = total === 0 || anySplitting;

        const scrollY = window.scrollY;
        fileListEl.innerHTML = '';
        if (items.length === 0) {
          fileListEl.appendChild(emptyState);
        } else {
          items.forEach(item => fileListEl.appendChild(createFileCard(item)));
        }
        window.scrollTo(0, scrollY);
      }

      function createFileCard(item) {
        const card = document.createElement('div');
        card.className = 'file-card';
        card.dataset.id = item.id;

        const isPdf = item.type === 'pdf';
        const badgeText = isPdf ? 'PDF' : (item.file.name.split('.').pop() || 'IMG').toUpperCase();
        const sizeMB = (item.file.size / (1024 * 1024)).toFixed(2);

        const head = document.createElement('div');
        head.className = 'file-card-head';

        const meta = document.createElement('div');
        meta.className = 'file-meta';
        meta.innerHTML = `
          <span class="badge">${esc(badgeText)}</span>
          <span class="file-name" title="${esc(item.file.name)}">${esc(item.file.name)}</span>
          <span class="file-size">${sizeMB} MB</span>
        `;
        head.appendChild(meta);

        const actions = document.createElement('div');
        actions.className = 'file-actions';

        const splitBtn = document.createElement('button');
        splitBtn.className = 'btn btn-sm';
        splitBtn.textContent = item.status === 'done' ? '重新分割' : '分割';
        splitBtn.disabled = item.status === 'splitting';
        splitBtn.addEventListener('click', () => splitSingle(item.id));
        actions.appendChild(splitBtn);

        if (item.status === 'done' && item.result) {
          const dl1 = document.createElement('button');
          dl1.className = 'btn btn-outline btn-sm';
          dl1.textContent = isPdf ? '下载PDF-A4①' : '下载 A4①';
          dl1.addEventListener('click', () => downloadItemA4_1(item));
          actions.appendChild(dl1);

          const dl2 = document.createElement('button');
          dl2.className = 'btn btn-outline btn-sm';
          dl2.textContent = isPdf ? '下载PDF-A4②' : '下载 A4②';
          dl2.addEventListener('click', () => downloadItemA4_2(item));
          actions.appendChild(dl2);

          const printBtn = document.createElement('button');
          printBtn.className = 'btn btn-sm btn-print';
          printBtn.textContent = '🖨️ 打印';
          printBtn.addEventListener('click', () => printItem(item));
          actions.appendChild(printBtn);
        }

        const removeBtn = document.createElement('button');
        removeBtn.className = 'btn btn-danger-outline btn-sm';
        removeBtn.textContent = '移除';
        removeBtn.disabled = item.status === 'splitting';
        removeBtn.addEventListener('click', () => removeItem(item.id));
        actions.appendChild(removeBtn);

        head.appendChild(actions);
        card.appendChild(head);

        const previewGrid = document.createElement('div');
        previewGrid.className = 'preview-grid';

        if (isPdf && item.status === 'done' && item.result?.pages) {
          previewGrid.appendChild(createPreviewCard(
            item, '①', '第1页 上/左', item.result.pages[0]?.a4_1?.dataUrl, item.status, 0));
          previewGrid.appendChild(createPreviewCard(
            item, '②', '第1页 下/右', item.result.pages[0]?.a4_2?.dataUrl, item.status, 1));
        } else {
          previewGrid.appendChild(createPreviewCard(
            item, '①', isPdf ? '上/左' : '左 / 上', item.result?.a4_1?.dataUrl, item.status, 0));
          previewGrid.appendChild(createPreviewCard(
            item, '②', isPdf ? '下/右' : '右 / 下', item.result?.a4_2?.dataUrl, item.status, 1));
        }

        card.appendChild(previewGrid);

        const statusEl = document.createElement('div');
        statusEl.className = 'card-status';
        if (item.status === 'splitting') {
          statusEl.innerHTML = '<div class="spinner"></div><span>正在分割...</span>';
        } else if (item.status === 'error') {
          statusEl.innerHTML = `<span style="color:#b13b3b;">❌ ${esc(item.errorMsg || '处理失败')}</span>`;
        } else if (item.status === 'done') {
          if (isPdf) {
            statusEl.innerHTML = `<span>✅ 已生成 ${item.result.pageCount * 2} 张 A4 JPG（原 ${item.result.pageCount} 页 PDF）</span>
              <span class="quality-tag">高质量 JPG</span>`;
          } else {
            statusEl.innerHTML = '<span>✅ 已分割为两张 A4 JPG</span><span class="quality-tag">高质量 JPG</span>';
          }
        } else {
          statusEl.innerHTML = '<span>⏳ 等待分割</span>';
        }
        card.appendChild(statusEl);

        return card;
      }

      function createPreviewCard(item, indexStr, label, dataUrl, status, pageIndex) {
        const wrap = document.createElement('div');
        wrap.className = 'preview-card';

        const title = document.createElement('div');
        title.className = 'preview-title';
        title.innerHTML = `<span>A4 ${indexStr}</span><span class="dim">${esc(label)}</span>`;
        wrap.appendChild(title);

        const imgBox = document.createElement('div');
        imgBox.className = 'preview-img';
        if (dataUrl) {
          const img = document.createElement('img');
          img.src = dataUrl;
          img.alt = `A4 ${indexStr}`;
          imgBox.appendChild(img);
        } else {
          const ph = document.createElement('div');
          ph.className = 'placeholder-img';
          if (status === 'splitting') {
            ph.innerHTML = '<div class="spinner"></div>处理中';
          } else if (status === 'error') {
            ph.innerHTML = '<span>⚠️</span>出错';
          } else {
            ph.innerHTML = '<span>🖼️</span>等待分割';
          }
          imgBox.appendChild(ph);
        }
        wrap.appendChild(imgBox);

        // 在预览图片下方加打印按钮（如果已有图片）
        if (dataUrl && item.status === 'done') {
          const printOneBtn = document.createElement('button');
          printOneBtn.className = 'btn btn-sm btn-print';
          printOneBtn.textContent = '🖨️ 打印这张';
          printOneBtn.style.marginTop = '8px';
          printOneBtn.addEventListener('click', () => {
            printSingleImage(item, pageIndex, indexStr === '①' ? 'a4_1' : 'a4_2');
          });
          wrap.appendChild(printOneBtn);
        }

        return wrap;
      }

      // ========== 打印功能 ==========
      function printSingleImage(item, pageIndex, which) {
        let dataUrl = null;
        if (item.type === 'image') {
          dataUrl = which === 'a4_1' ? item.result.a4_1?.dataUrl : item.result.a4_2?.dataUrl;
        } else if (item.type === 'pdf' && item.result.pages) {
          const page = item.result.pages[pageIndex];
          if (page) {
            dataUrl = which === 'a4_1' ? page.a4_1?.dataUrl : page.a4_2?.dataUrl;
          }
        }
        if (!dataUrl) {
          alert('图片数据不存在');
          return;
        }
        // 构建打印区域
        printArea.innerHTML = '';
        const pageDiv = document.createElement('div');
        pageDiv.className = 'print-page';
        const img = document.createElement('img');
        img.src = dataUrl;
        pageDiv.appendChild(img);
        printArea.appendChild(pageDiv);
        printArea.style.display = 'block';

        // 触发打印
        window.print();

        // 打印后恢复
        setTimeout(() => {
          printArea.style.display = 'none';
          printArea.innerHTML = '';
        }, 500);
      }

      function printItem(item) {
        if (item.status !== 'done' || !item.result) return;
        printArea.innerHTML = '';

        if (item.type === 'image') {
          // 打印两张 A4
          const d1 = item.result.a4_1?.dataUrl;
          const d2 = item.result.a4_2?.dataUrl;
          if (d1) {
            const pageDiv1 = document.createElement('div');
            pageDiv1.className = 'print-page';
            const img1 = document.createElement('img');
            img1.src = d1;
            pageDiv1.appendChild(img1);
            printArea.appendChild(pageDiv1);
          }
          if (d2) {
            const pageDiv2 = document.createElement('div');
            pageDiv2.className = 'print-page';
            const img2 = document.createElement('img');
            img2.src = d2;
            pageDiv2.appendChild(img2);
            printArea.appendChild(pageDiv2);
          }
        } else if (item.type === 'pdf' && item.result.pages) {
          // 打印 PDF 所有页的分割图
          item.result.pages.forEach(page => {
            if (page.a4_1?.dataUrl) {
              const pageDiv1 = document.createElement('div');
              pageDiv1.className = 'print-page';
              const img1 = document.createElement('img');
              img1.src = page.a4_1.dataUrl;
              pageDiv1.appendChild(img1);
              printArea.appendChild(pageDiv1);
            }
            if (page.a4_2?.dataUrl) {
              const pageDiv2 = document.createElement('div');
              pageDiv2.className = 'print-page';
              const img2 = document.createElement('img');
              img2.src = page.a4_2.dataUrl;
              pageDiv2.appendChild(img2);
              printArea.appendChild(pageDiv2);
            }
          });
        }

        if (printArea.children.length === 0) {
          alert('没有可打印的内容');
          return;
        }

        printArea.style.display = 'block';
        window.print();
        setTimeout(() => {
          printArea.style.display = 'none';
          printArea.innerHTML = '';
        }, 500);
      }

      // ========== 文件处理 ==========
      function addFiles(fileList) {
        if (!fileList || fileList.length === 0) return;
        const newItems = [];
        for (const file of fileList) {
          const isPdf = file.type === 'application/pdf' ||
                        file.name.toLowerCase().endsWith('.pdf');
          const isImage = file.type.startsWith('image/');
          if (!isPdf && !isImage) continue;

          const dup = items.some(it =>
            it.file.name === file.name &&
            it.file.size === file.size &&
            it.file.lastModified === file.lastModified);
          if (dup) continue;

          newItems.push({
            id: nextId++,
            file,
            type: isPdf ? 'pdf' : 'image',
            image: null,
            pdfData: null,
            status: 'pending',
            result: null,
            errorMsg: null
          });
        }
        if (newItems.length === 0) return;
        items = items.concat(newItems);
        render();

        // 上传后自动分割每个新文件
        newItems.forEach(async (item) => {
          // 自动开始分割
          await autoSplitItem(item.id);
        });
      }

      async function autoSplitItem(id) {
        const item = items.find(it => it.id === id);
        if (!item || item.status === 'splitting') return;
        // 如果已分割，不重复自动分割
        if (item.status === 'done') return;

        item.status = 'splitting';
        item.errorMsg = null;
        item.result = null;
        render();

        try {
          if (item.type === 'image') {
            if (!item.image) item.image = await loadImageFromFile(item.file);
            const img = item.image;
            const isLandscape = img.naturalWidth >= img.naturalHeight;
            const { c1, c2 } = splitSourceToTwo(img, isLandscape);
            const jpg1 = canvasToJpg(c1);
            const jpg2 = canvasToJpg(c2);
            item.result = {
              a4_1: { dataUrl: jpg1.dataUrl, blob: jpg1.blob },
              a4_2: { dataUrl: jpg2.dataUrl, blob: jpg2.blob }
            };
            item.status = 'done';
          } else {
            if (!item.pdfData) item.pdfData = await item.file.arrayBuffer();
            const result = await splitPdfToA4Jpg(item.pdfData);
            item.result = result;
            item.status = 'done';
          }
        } catch (err) {
          console.error(err);
          item.status = 'error';
          item.errorMsg = err.message || '处理失败';
        }
        render();
      }

      // 手动分割（用于重新分割按钮）
      async function splitSingle(id) {
        const item = items.find(it => it.id === id);
        if (!item || item.status === 'splitting') return;
        if (item.status === 'done' && !confirm('重新分割会覆盖现有结果，确定吗？')) return;
        await autoSplitItem(id);
      }

      function loadImageFromFile(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error('图片加载失败'));
            img.src = e.target.result;
          };
          reader.onerror = () => reject(new Error('文件读取失败'));
          reader.readAsDataURL(file);
        });
      }

      function removeItem(id) {
        items = items.filter(it => it.id !== id);
        render();
      }

      // ========== 分割 PDF → JPG ==========
      async function splitPdfToA4Jpg(pdfArrayBuffer) {
        const loadingTask = pdfjsLib.getDocument({ data: pdfArrayBuffer });
        const pdf = await loadingTask.promise;
        const numPages = pdf.numPages;
        if (numPages === 0) throw new Error('PDF 没有页面');

        const pages = [];

        for (let i = 1; i <= numPages; i++) {
          const page = await pdf.getPage(i);
          const viewport = page.getViewport({ scale: 2.5 });
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          const ctx = canvas.getContext('2d');
          await page.render({ canvasContext: ctx, viewport }).promise;

          const isLandscape = canvas.width >= canvas.height;
          const { c1, c2 } = splitSourceToTwo(canvas, isLandscape);

          const jpg1 = canvasToJpg(c1);
          const jpg2 = canvasToJpg(c2);

          pages.push({
            a4_1: { dataUrl: jpg1.dataUrl, blob: jpg1.blob },
            a4_2: { dataUrl: jpg2.dataUrl, blob: jpg2.blob }
          });
        }

        return { pages, pageCount: numPages };
      }
