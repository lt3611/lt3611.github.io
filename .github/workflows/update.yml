name: Live Source Auto Update

on:
  schedule:
    - cron: "0 */6 * * *"  # 每 6 小时更新一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Collector
        run: python zhibo_collector.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zhibo.txt
          git diff --quiet && git diff --staged --quiet && exit 0
          git commit -m "auto: update zhibo.txt $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
