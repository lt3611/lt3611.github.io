name: Build Android APK with Capacitor

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 允许手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install dependencies & Setup Capacitor
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "MyApp" "com.example.myapp" --web-dir "www"
        
    # ⚠️ 注意：这里假设你的网页代码放在仓库的 www 文件夹下
    # 如果你的网页在根目录，请用 mkdir www && cp -r *.html *.css *.js www/ 移动到 www 里

    - name: Add Android Platform
      run: npx cap add android

    # 这一步非常关键：自动修改 AndroidManifest.xml 注入网络权限和明文传输
    - name: Inject Permissions (INTERNET & Cleartext)
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        # 注入 INTERNET 权限
        sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <application|g' $MANIFEST
        # 允许 HTTP 明文请求 (解决 192.168.x.x 访问失败)
        sed -i 's|<application|<application android:usesCleartextTraffic="true"|g' $MANIFEST

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
