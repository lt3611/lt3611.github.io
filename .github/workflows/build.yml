name: Build Android APK with Capacitor

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    # 👇 关键修复 1：升级到 JDK 21
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Prepare www directory
      run: |
        mkdir -p www
        cp -r ./* www/ 2>/dev/null || true
        rm -rf www/node_modules www/.git www/.github www/android www/ios

    - name: Install dependencies & Setup Capacitor
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "MyApp" "com.example.myapp" --web-dir "www"

    - name: Add Android Platform
      run: npx cap add android

    - name: Sync Capacitor Android
      run: npx cap sync android

    # 👇 关键修复 2：强制升级 Gradle 到 8.4，避开 8.2.1 的缓存 Bug
    - name: Upgrade Gradle Wrapper
      run: |
        cd android
        chmod +x gradlew
        ./gradlew wrapper --gradle-version 8.4 --distribution-type bin

    - name: Inject Permissions (INTERNET & Cleartext)
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <application|g' $MANIFEST
        sed -i 's|<application|<application android:usesCleartextTraffic="true"|g' $MANIFEST

    - name: Build Android APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
