<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自用导航 - 链接集合</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(145deg, #f8faff 0%, #eef2f9 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
  }

  .card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 24px;
    padding: 32px 20px;
    box-shadow: 0 25px 40px -12px rgba(0, 20, 60, 0.25),
                inset 0 1px 2px rgba(255, 255, 255, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    max-width: 520px;
    width: 100%;
  }

  .title {
    font-size: 24px;
    font-weight: 600;
    color: #1f2a4a;
    text-align: center;
  }

  .title span {
    background: linear-gradient(135deg, #3b5bdb, #8b5cf6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub {
    font-size: 14px;
    color: #4b587c;
    text-align: center;
    margin-top: -10px;
  }

  /* ===== 主页按钮 ===== */
  .home-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 15px 20px;
    border-radius: 60px;
    background: linear-gradient(135deg, #3b5bdb, #8b5cf6);
    color: #fff;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.01em;
    text-decoration: none;
    white-space: nowrap;
    box-shadow: 0 10px 20px -8px rgba(59, 91, 219, 0.5),
                0 4px 10px rgba(59, 91, 219, 0.15),
                inset 0 1px 1px rgba(255, 255, 255, 0.25);
    transition: transform 0.15s ease, box-shadow 0.25s ease, filter 0.25s ease;
    -webkit-tap-highlight-color: transparent;
    margin-bottom: 4px;
  }

  .home-btn:hover { transform: translateY(-1px); filter: brightness(1.05); }
  .home-btn:active { transform: translateY(1px); }

  .home-btn svg {
    width: 18px; height: 18px; flex-shrink: 0;
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }

  /* ===== 左右等分大区块 ===== */
  .main-layout {
    display: flex;
    gap: 12px;
    width: 100%;
    margin-top: 4px;
  }

  /* 左侧容器（放3列跳转按钮） */
  .left-block {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px 8px;
  }

  /* 右侧容器（放3列复制按钮） */
  .right-block {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px 8px;
  }

  /* ===== 按钮统一基础样式 ===== */
  .action-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 44px; /* 适配3列，略微变矮 */
    border-radius: 60px;
    color: #fff;
    font-weight: 500;
    font-size: 12px; /* 字号调小防止溢出 */
    letter-spacing: 0.01em;
    white-space: nowrap;
    text-decoration: none;
    cursor: pointer;
    border: none;
    outline: none;
    font-family: inherit;
    transition: transform 0.15s ease, box-shadow 0.25s ease, filter 0.25s ease, background 0.25s ease;
    -webkit-tap-highlight-color: transparent;
    padding: 0 4px;
  }

  /* 左栏按钮（紫蓝渐变） */
  .link-btn {
    background: linear-gradient(135deg, #4b6df0, #8b5cf6);
    box-shadow: 0 6px 16px -6px rgba(59, 91, 219, 0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
  }

  .link-btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .link-btn:active { transform: translateY(1px); }

  /* 右栏按钮（深色） */
  .copy-btn {
    background: #1a2b4c;
    box-shadow: 0 6px 16px -6px rgba(26, 43, 76, 0.4),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
  }

  .copy-btn:hover { background: #233a62; transform: translateY(-1px); }
  .copy-btn:active { transform: translateY(1px); background: #16233d; }

  /* 图标统一尺寸 */
  .action-btn svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* 复制成功状态 */
  .copy-btn.copied {
    background: #2b6e4f;
    box-shadow: 0 6px 16px -6px rgba(43, 110, 79, 0.5);
  }
  .copy-btn.copied:hover { background: #2f7a58; }

  /* Toast */
  .toast-message {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: #1e293b;
    color: #f1f5f9;
    padding: 12px 28px;
    border-radius: 60px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.4);
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.25s ease;
    pointer-events: none;
    z-index: 9999;
    white-space: nowrap;
  }
  .toast-message.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 380px) {
    .main-layout { gap: 8px; }
    .left-block, .right-block { gap: 10px 4px; }
    .action-btn { height: 40px; font-size: 11px; }
    .action-btn svg { width: 12px; height: 12px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="title"><span>自用导航</span> 链接集合</div>

  <!-- 主页按钮 -->
  <a class="home-btn" id="homeBtn" href="#" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24">
      <path d="M3 9.5L12 3l9 6.5"/>
      <path d="M5 10v10h14V10"/>
      <path d="M9 20v-6h6v6"/>
    </svg>
    <span>主页</span>
  </a>

  <p class="sub">左边点击跳转，右边点击复制</p>

  <!-- 左右大区块 -->
  <div class="main-layout">
    <!-- 左侧容器：放三排跳转数据 -->
    <div class="left-block" id="leftContainer"></div>
    <!-- 右侧容器：放三排复制数据 -->
    <div class="right-block" id="rightContainer"></div>
  </div>
</div>

<div class="toast-message" id="toast">✅ 链接已复制</div>

<script>
(function () {
  'use strict';

  // ==========================================
  // ⬇️ 左侧（跳转按钮）数据配置区 ⬇️
  // 每一条数据会生成一列竖排的按钮
  // ==========================================
  const leftData = [
    { text: '路由', url: 'http://192.168.50.1' },
    { text: '电视', url: 'http://192.168.50.198:56789' },
    { text: '学习', url: 'http://192.168.50.1:9990/ui/zashboard/#/setup?hostname=192.168.50.1&port=9990&secret=clash' },
    { text: '调试', url: 'http://192.168.50.1' },
    { text: '开始1', url: 'http://lt3611.ccwu.cc' } // <--- 第三排数据在这里
  ];

  // ==========================================
  // ⬇️ 右侧（复制按钮）数据配置区 ⬇️
  // 每一条数据会生成一列竖排的按钮
  // ==========================================
  const rightData = [
    { text: '路由导航', url: 'http://lt3611.ccwu.cc/tools/tv.txt' },
    { text: '电视导航', url: 'http://lt3611.ccwu.cc/tools/tv3.txt' },
    { text: '学习导航', url: 'http://lt3611.ccwu.cc/tools/tv1.txt' },
    { text: '调试导航', url: 'http://lt3611.ccwu.cc/tools/tv2.txt' },
    { text: '开始1导航', url: 'http://lt3611.ccwu.cc' }
  ];


  // ==========================================
  // ⬇️ 以下是自动生成和交互逻辑（无需修改） ⬇️
  // ==========================================

  const HOME_URL = 'http://lt3611.ccwu.cc/';
  const homeBtn = document.getElementById('homeBtn');
  if (homeBtn) homeBtn.href = HOME_URL;

  const leftContainer = document.getElementById('leftContainer');
  const rightContainer = document.getElementById('rightContainer');
  
  const linkSvg = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8"/><path d="M3.6 15h16.8"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></svg>`;
  const copySvg = `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;

  // 渲染左侧（跳转）
  let leftHtml = '';
  leftData.forEach(item => {
    // 每一个数据生成一个按钮，由于外层是 grid，会自动排成 3 列并向下延伸
    leftHtml += `
      <a class="action-btn link-btn" href="${item.url}" target="_blank" rel="noopener">
        ${linkSvg}
        <span>${item.text}</span>
      </a>
    `;
  });
  leftContainer.innerHTML = leftHtml;

  // 渲染右侧（复制）
  let rightHtml = '';
  rightData.forEach(item => {
    rightHtml += `
      <button class="action-btn copy-btn" data-copy="${item.url}">
        ${copySvg}
        <span class="btn-text">${item.text}</span>
      </button>
    `;
  });
  rightContainer.innerHTML = rightHtml;


  // ===== 复制逻辑 =====
  var toastEl = document.getElementById('toast');
  var copyBtns = document.querySelectorAll('.copy-btn');
  var toastTimer = null;

  function showToast(message, duration) {
    if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
    toastEl.textContent = message;
    toastEl.classList.add('show');
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
      toastTimer = null;
    }, duration || 2000);
  }

  function fallbackCopy(text) {
    return new Promise(function (resolve) {
      var textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.top = '-9999px';
      textarea.style.left = '-9999px';
      textarea.style.opacity = '0';
      textarea.setAttribute('readonly', '');
      document.body.appendChild(textarea);
      textarea.select();
      textarea.setSelectionRange(0, textarea.value.length);
      var success = false;
      try { success = document.execCommand('copy'); } catch (e) { success = false; }
      document.body.removeChild(textarea);
      resolve(success);
    });
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () {
        return true;
      }).catch(function () {
        return fallbackCopy(text);
      });
    }
    return fallbackCopy(text);
  }

  copyBtns.forEach(function (btn) {
    var btnText = btn.querySelector('.btn-text');
    var defaultText = btnText.textContent;
    var restoreTimer = null;
    var failTimer = null;

    btn.addEventListener('click', function () {
      var textToCopy = btn.getAttribute('data-copy') || '';

      btn.disabled = true;
      btn.style.opacity = '0.8';

      copyText(textToCopy).then(function (success) {
        if (success) {
          btn.classList.add('copied');
          btnText.textContent = '已复制!';
          showToast('✅ ' + defaultText + '已复制', 2000);

          if (restoreTimer) clearTimeout(restoreTimer);
          restoreTimer = setTimeout(function () {
            btnText.textContent = defaultText;
            btn.classList.remove('copied');
            restoreTimer = null;
          }, 2000);
        } else {
          showToast('❌ 复制失败，请手动复制', 2000);
          btnText.textContent = '复制失败';
          if (failTimer) clearTimeout(failTimer);
          failTimer = setTimeout(function () {
            btnText.textContent = defaultText;
            failTimer = null;
          }, 2000);
        }
      }).catch(function () {
        showToast('❌ 复制失败，请稍后重试', 2000);
        btnText.textContent = defaultText;
      }).finally(function () {
        btn.disabled = false;
        btn.style.opacity = '1';
      });
    });
  });
})();
</script>

</body>
</html>
