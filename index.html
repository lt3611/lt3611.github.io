<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自用导航 - 链接集合</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(145deg, #f8faff 0%, #eef2f9 100%);
    min-height: 100vh;
    display: flex;
    align-items: flex-start; 
    justify-content: center;
    padding: 15px; 
  }

  .card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 24px;
    padding: 24px 20px; 
    box-shadow: 0 25px 40px -12px rgba(0, 20, 60, 0.25),
                inset 0 1px 2px rgba(255, 255, 255, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    max-width: 500px;
    width: 100%;
  }

  /* 分组标题栏 */
  .grid-header {
    display: grid;
    grid-template-columns: repeat(3, 1fr); 
    gap: 12px 10px;
    width: 100%;
    margin-bottom: -6px; 
  }

  .grid-header div {
    font-size: 14px;
    font-weight: 500;
    color: #4b587c;
    text-align: center;
  }

  /* 主页按钮 */
  .home-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 15px 20px;
    border-radius: 60px;
    background: linear-gradient(135deg, #3b5bdb, #8b5cf6);
    color: #fff;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.01em;
    text-decoration: none;
    white-space: nowrap;
    box-shadow: 0 10px 20px -8px rgba(59, 91, 219, 0.5),
                0 4px 10px rgba(59, 91, 219, 0.15),
                inset 0 1px 1px rgba(255, 255, 255, 0.25);
    transition: transform 0.15s ease, box-shadow 0.25s ease, filter 0.25s ease;
    -webkit-tap-highlight-color: transparent;
    margin-bottom: 4px;
  }

  .home-btn:hover { transform: translateY(-1px); filter: brightness(1.05); }
  .home-btn:active { transform: translateY(1px); }

  .home-btn svg {
    width: 18px; height: 18px; flex-shrink: 0;
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }

  /* 三列网格容器 */
  .grid-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px 10px;
    width: 100%;
  }

  /* 按钮基础样式 */
  .action-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 46px;
    border-radius: 60px;
    color: #fff;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.01em;
    white-space: nowrap;
    text-decoration: none;
    cursor: pointer;
    border: none;
    outline: none;
    font-family: inherit;
    transition: transform 0.15s ease, box-shadow 0.25s ease, filter 0.25s ease, background 0.25s ease;
    -webkit-tap-highlight-color: transparent;
    padding: 0 4px;
  }

  /* 跳转按钮样式 - 紫蓝渐变 */
  .link-btn {
    background: linear-gradient(135deg, #4b6df0, #8b5cf6);
    box-shadow: 0 6px 16px -6px rgba(59, 91, 219, 0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
  }

  .link-btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .link-btn:active { transform: translateY(1px); }

  /* 复制按钮样式 - 深色 */
  .copy-btn {
    background: #1a2b4c;
    box-shadow: 0 6px 16px -6px rgba(26, 43, 76, 0.4),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
  }

  .copy-btn:hover { background: #233a62; transform: translateY(-1px); }
  .copy-btn:active { transform: translateY(1px); background: #16233d; }

  .action-btn svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* 复制成功状态 */
  .copy-btn.copied {
    background: #2b6e4f;
    box-shadow: 0 6px 16px -6px rgba(43, 110, 79, 0.5);
  }
  .copy-btn.copied:hover { background: #2f7a58; }

  /* 提示框 */
  .toast-message {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: #1e293b;
    color: #f1f5f9;
    padding: 12px 28px;
    border-radius: 60px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.4);
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.25s ease;
    pointer-events: none;
    z-index: 9999;
    white-space: nowrap;
  }
  .toast-message.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .loading-text { color: #64748b; font-size: 14px; margin: 20px 0; }

  @media (max-width: 380px) {
    .grid-header { gap: 10px 6px; }
    .grid-container { gap: 10px 6px; }
    .action-btn { height: 42px; font-size: 12px; }
    .action-btn svg { width: 12px; height: 12px; }
  }
</style>
</head>
<body>

<div class="card">
  <!-- 主页按钮 -->
  <a class="home-btn" id="homeBtn" href="#" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24">
      <path d="M3 9.5L12 3l9 6.5"/>
      <path d="M5 10v10h14V10"/>
      <path d="M9 20v-6h6v6"/>
    </svg>
    <span>主页</span>
  </a>

  <!-- 分组标题栏 -->
  <div class="grid-header">
    <div>常用工具</div>
    <div>家里网址</div>
    <div>网络应用</div>
  </div>

  <!-- 3列网格容器 -->
  <div class="grid-container" id="gridContainer">
    <div class="loading-text" style="grid-column: span 3; text-align: center;">正在加载数据...</div>
  </div>
</div>

<div class="toast-message" id="toast">✅ 链接已复制</div>

<script>
(function () {
  'use strict';

  // ==========================================
  // ⬇️ 核心加载逻辑：远程优先，失败降级本地 ⬇️
  // ==========================================
  const REMOTE_JS_URL = 'http://lt3611.ccwu.cc/zy-data.js';
  const LOCAL_JS_URL = 'zy-data.js';

  async function init() {
    let configLoaded = false;

    // 尝试获取远程数据
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 3000); // 3秒超时

      const response = await fetch(REMOTE_JS_URL, { signal: controller.signal });
      clearTimeout(timeoutId);

      if (!response.ok) throw new Error('网络请求失败');
      
      const text = await response.text();
      const script = document.createElement('script');
      script.textContent = text;
      document.head.appendChild(script);
      script.remove();

      if (window.NAV_CONFIG) {
        configLoaded = true;
        console.log('✅ 使用远程数据加载成功');
      }
    } catch (error) {
      console.warn('⚠️ 远程数据加载失败，准备加载本地数据', error);
    }

    // 如果远程失败，尝试获取本地数据
    if (!configLoaded) {
      try {
        const response = await fetch(LOCAL_JS_URL);
        if (!response.ok) throw new Error('本地文件不存在或路径错误');
        
        const text = await response.text();
        const script = document.createElement('script');
        script.textContent = text;
        document.head.appendChild(script);
        script.remove();

        if (window.NAV_CONFIG) {
          configLoaded = true;
          console.log('✅ 使用本地数据加载成功');
        }
      } catch (localError) {
        console.error('❌ 本地数据加载失败', localError);
        document.getElementById('gridContainer').innerHTML = '<div class="loading-text" style="grid-column: span 3; text-align: center; color: red;">数据加载失败，请检查网络或本地 zy-data.js</div>';
        return;
      }
    }

    // 如果数据加载成功，开始渲染
    if (configLoaded && window.NAV_CONFIG) {
      renderPage(window.NAV_CONFIG);
    }
  }


  // ==========================================
  // ⬇️ 渲染页面逻辑 ⬇️
  // ==========================================
  function renderPage(config) {
    const HOME_URL = config.home || '#';
    const rowData = config.rows || [];

    const homeBtn = document.getElementById('homeBtn');
    if (homeBtn) homeBtn.href = HOME_URL;

    const gridContainer = document.getElementById('gridContainer');
    
    const linkSvg = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8"/><path d="M3.6 15h16.8"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></svg>`;
    const copySvg = `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;

    let htmlContent = '';
    
    rowData.forEach((item) => {
      // 左侧
      htmlContent += `
        <a class="action-btn link-btn" href="${item.leftUrl}" target="_blank" rel="noopener">
          ${linkSvg}
          <span>${item.leftText}</span>
        </a>
      `;
      // 中间
      htmlContent += `
        <a class="action-btn link-btn" href="${item.middleUrl}" target="_blank" rel="noopener">
          ${linkSvg}
          <span>${item.middleText}</span>
        </a>
      `;
      // 右侧（根据 rightType 判断）
      if (item.rightType === 'link') {
        htmlContent += `
          <a class="action-btn link-btn" href="${item.rightUrl}" target="_blank" rel="noopener">
            ${linkSvg}
            <span>${item.rightText}</span>
          </a>
        `;
      } else {
        htmlContent += `
          <button class="action-btn copy-btn" data-copy="${item.rightUrl}">
            ${copySvg}
            <span class="btn-text">${item.rightText}</span>
          </button>
        `;
      }
    });

    gridContainer.innerHTML = htmlContent;

    // 绑定复制事件
    if (document.querySelectorAll('.copy-btn').length > 0) {
      bindCopyEvents();
    }
  }


  // ==========================================
  // ⬇️ 复制交互逻辑 ⬇️
  // ==========================================
  function bindCopyEvents() {
    var toastEl = document.getElementById('toast');
    var copyBtns = document.querySelectorAll('.copy-btn');
    var toastTimer = null;

    function showToast(message, duration) {
      if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
      toastEl.textContent = message;
      toastEl.classList.add('show');
      toastTimer = setTimeout(function () {
        toastEl.classList.remove('show');
        toastTimer = null;
      }, duration || 2000);
    }

    function fallbackCopy(text) {
      return new Promise(function (resolve) {
        var textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.top = '-9999px';
        textarea.style.left = '-9999px';
        textarea.style.opacity = '0';
        textarea.setAttribute('readonly', '');
        document.body.appendChild(textarea);
        textarea.select();
        textarea.setSelectionRange(0, textarea.value.length);
        var success = false;
        try { success = document.execCommand('copy'); } catch (e) { success = false; }
        document.body.removeChild(textarea);
        resolve(success);
      });
    }

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).then(function () {
          return true;
        }).catch(function () {
          return fallbackCopy(text);
        });
      }
      return fallbackCopy(text);
    }

    copyBtns.forEach(function (btn) {
      var btnText = btn.querySelector('.btn-text');
      var defaultText = btnText.textContent;
      var restoreTimer = null;
      var failTimer = null;

      btn.addEventListener('click', function () {
        var textToCopy = btn.getAttribute('data-copy') || '';

        btn.disabled = true;
        btn.style.opacity = '0.8';

        copyText(textToCopy).then(function (success) {
          if (success) {
            btn.classList.add('copied');
            btnText.textContent = '已复制!';
            showToast('✅ ' + defaultText + '已复制', 2000);

            if (restoreTimer) clearTimeout(restoreTimer);
            restoreTimer = setTimeout(function () {
              btnText.textContent = defaultText;
              btn.classList.remove('copied');
              restoreTimer = null;
            }, 2000);
          } else {
            showToast('❌ 复制失败，请手动复制', 2000);
            btnText.textContent = '复制失败';
            if (failTimer) clearTimeout(failTimer);
            failTimer = setTimeout(function () {
              btnText.textContent = defaultText;
              failTimer = null;
            }, 2000);
          }
        }).catch(function () {
          showToast('❌ 复制失败，请稍后重试', 2000);
          btnText.textContent = defaultText;
        }).finally(function () {
          btn.disabled = false;
          btn.style.opacity = '1';
        });
      });
    });
  }

  // 启动运行
  init();

})();
</script>

</body>
</html>
