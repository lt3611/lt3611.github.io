<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自用导航 - 链接集合</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(145deg, #f8faff 0%, #eef2f9 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
  }

  .card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 24px;
    padding: 28px 16px;
    box-shadow: 0 25px 40px -12px rgba(0, 20, 60, 0.25),
                inset 0 1px 2px rgba(255, 255, 255, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    max-width: 560px;
    width: 100%;
  }

  .title {
    font-size: 24px;
    font-weight: 600;
    color: #1f2a4a;
    text-align: center;
  }

  .title span {
    background: linear-gradient(135deg, #3b5bdb, #8b5cf6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub {
    font-size: 14px;
    color: #4b587c;
    text-align: center;
    margin-top: -10px;
  }

  /* ===== 主页按钮 ===== */
  .home-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 15px 20px;
    border-radius: 60px;
    background: linear-gradient(135deg, #3b5bdb, #8b5cf6);
    color: #fff;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.01em;
    text-decoration: none;
    white-space: nowrap;
    box-shadow: 0 10px 20px -8px rgba(59, 91, 219, 0.5),
                0 4px 10px rgba(59, 91, 219, 0.15),
                inset 0 1px 1px rgba(255, 255, 255, 0.25);
    transition: transform 0.15s ease, box-shadow 0.25s ease, filter 0.25s ease;
    -webkit-tap-highlight-color: transparent;
    margin-bottom: 4px;
  }

  .home-btn:hover { transform: translateY(-1px); filter: brightness(1.05); }
  .home-btn:active { transform: translateY(1px); }

  .home-btn svg {
    width: 18px; height: 18px; flex-shrink: 0;
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }

  /* ===== 主体：左右两个大区块并排 ===== */
  .main-layout {
    display: flex;
    gap: 12px;
    width: 100%;
    margin-top: 4px;
  }

  /* 左侧区块容器（包裹里面的三排） */
  .left-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px; /* 排与排之间的间距 */
  }

  /* 右侧区块容器 */
  .right-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* 每一排的内部网格（3列） */
  .row-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px; /* 按钮左右之间的间距 */
  }

  /* ===== 统一按钮基础样式 ===== */
  .action-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 44px;
    border-radius: 60px;
    color: #fff;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.01em;
    white-space: nowrap;
    text-decoration: none;
    cursor: pointer;
    border: none;
    outline: none;
    font-family: inherit;
    transition: transform 0.15s ease, box-shadow 0.25s ease, filter 0.25s ease, background 0.25s ease;
    -webkit-tap-highlight-color: transparent;
    padding: 0 4px;
  }

  /* 左栏（跳转网址）按钮样式 */
  .link-btn {
    background: linear-gradient(135deg, #4b6df0, #8b5cf6);
    box-shadow: 0 6px 16px -6px rgba(59, 91, 219, 0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
  }

  .link-btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .link-btn:active { transform: translateY(1px); }

  /* 右栏（复制链接）按钮样式 */
  .copy-btn {
    background: #1a2b4c;
    box-shadow: 0 6px 16px -6px rgba(26, 43, 76, 0.4),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
  }

  .copy-btn:hover { background: #233a62; transform: translateY(-1px); }
  .copy-btn:active { transform: translateY(1px); background: #16233d; }

  /* 图标统一尺寸 */
  .action-btn svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* 复制成功状态 */
  .copy-btn.copied {
    background: #2b6e4f;
    box-shadow: 0 6px 16px -6px rgba(43, 110, 79, 0.5);
  }
  .copy-btn.copied:hover { background: #2f7a58; }

  /* Toast */
  .toast-message {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: #1e293b;
    color: #f1f5f9;
    padding: 12px 28px;
    border-radius: 60px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.4);
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.25s ease;
    pointer-events: none;
    z-index: 9999;
    white-space: nowrap;
  }
  .toast-message.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 极窄屏幕微调 */
  @media (max-width: 380px) {
    .main-layout { gap: 8px; }
    .left-block, .right-block { gap: 10px; }
    .row-grid { gap: 4px; }
    .action-btn { height: 40px; font-size: 11px; }
    .action-btn svg { width: 12px; height: 12px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="title"><span>自用导航</span> 链接集合</div>

  <!-- 主页按钮 -->
  <a class="home-btn" id="homeBtn" href="#" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24">
      <path d="M3 9.5L12 3l9 6.5"/>
      <path d="M5 10v10h14V10"/>
      <path d="M9 20v-6h6v6"/>
    </svg>
    <span>主页</span>
  </a>

  <p class="sub">点击跳转，长按或点击右侧复制</p>

  <!-- 左右大区块 -->
  <div class="main-layout">
    <!-- 左侧容器 -->
    <div class="left-block">
      <div class="row-grid" id="leftRow1"></div>
      <div class="row-grid" id="leftRow2"></div>
      <div class="row-grid" id="leftRow3"></div>
    </div>
    
    <!-- 右侧容器 -->
    <div class="right-block">
      <div class="row-grid" id="rightRow1"></div>
      <div class="row-grid" id="rightRow2"></div>
      <div class="row-grid" id="rightRow3"></div>
    </div>
  </div>
</div>

<div class="toast-message" id="toast">✅ 链接已复制</div>

<script>
(function () {
  'use strict';

  // ==========================================
  // ⬇️ 配置区：按排分配数据 ⬇️
  // ==========================================
  
  const HOME_URL = 'http://lt3611.ccwu.cc/';

  // 第一排数据（上）
  const row1Data = [
    { leftText: '路由', rightText: '电视导航', linkUrl: 'http://192.168.50.1', copyUrl: 'http://lt3611.ccwu.cc/tools/tv.txt' },
    { leftText: '电视', rightText: '电视新闻', linkUrl: 'http://192.168.50.198:56789', copyUrl: 'http://lt3611.ccwu.cc/tools/tv3.txt' },
    { leftText: '学习', rightText: '影视学习', linkUrl: 'http://192.168.50.1:9999', copyUrl: 'http://lt3611.ccwu.cc/tools/tv1.txt' },
    { leftText: '调试', rightText: '影视复制', linkUrl: 'http://192.168.50.1', copyUrl: 'http://lt3611.ccwu.cc/tools/tv2.txt' }
  ];

  // 第二排数据（中）
  const row2Data = [
    { leftText: '备用1', rightText: '复制1', linkUrl: '#', copyUrl: '#' },
    { leftText: '备用2', rightText: '复制2', linkUrl: '#', copyUrl: '#' },
    { leftText: '备用3', rightText: '复制3', linkUrl: '#', copyUrl: '#' },
    { leftText: '备用4', rightText: '复制4', linkUrl: '#', copyUrl: '#' }
  ];

  // 第三排数据（下）—— 填入了您给的新数据
  const row3Data = [
    { leftText: '开始1', rightText: '开始1', linkUrl: 'http://lt3611.ccwu.cc', copyUrl: 'http://lt3611.ccwu.cc' },
    { leftText: '开始2', rightText: '开始2', linkUrl: 'http://lt3611.ccwu.cc', copyUrl: 'http://lt3611.ccwu.cc' },
    { leftText: '开始3', rightText: '开始3', linkUrl: 'http://lt3611.ccwu.cc', copyUrl: 'http://lt3611.ccwu.cc' },
    { leftText: '开始4', rightText: '开始4', linkUrl: 'http://lt3611.ccwu.cc', copyUrl: 'http://lt3611.ccwu.cc' }
  ];


  // ==========================================
  // ⬇️ 以下是自动生成和交互逻辑（无需修改） ⬇️
  // ==========================================

  const homeBtn = document.getElementById('homeBtn');
  if (homeBtn) homeBtn.href = HOME_URL;

  const linkSvg = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8"/><path d="M3.6 15h16.8"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></svg>`;
  const copySvg = `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;

  // 通用的渲染函数：传入数据数组和目标 DOM 容器
  function renderRow(dataArray, leftContainerId, rightContainerId) {
    let leftHtml = '';
    let rightHtml = '';

    // 因为要生成3列，所以把传进来的4个数据，每个循环生成3个按钮
    dataArray.forEach(item => {
      for(let i = 0; i < 3; i++) {
        leftHtml += `
          <a class="action-btn link-btn" href="${item.linkUrl}" target="_blank" rel="noopener">
            ${linkSvg}
            <span>${item.leftText}</span>
          </a>
        `;
        rightHtml += `
          <button class="action-btn copy-btn" data-copy="${item.copyUrl}">
            ${copySvg}
            <span class="btn-text">${item.rightText}</span>
          </button>
        `;
      }
    });

    document.getElementById(leftContainerId).innerHTML = leftHtml;
    document.getElementById(rightContainerId).innerHTML = rightHtml;
  }

  // 渲染三排数据
  renderRow(row1Data, 'leftRow1', 'rightRow1');
  renderRow(row2Data, 'leftRow2', 'rightRow2');
  renderRow(row3Data, 'leftRow3', 'rightRow3');


  // ===== 复制逻辑 =====
  var toastEl = document.getElementById('toast');
  var copyBtns = document.querySelectorAll('.copy-btn');
  var toastTimer = null;

  function showToast(message, duration) {
    if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
    toastEl.textContent = message;
    toastEl.classList.add('show');
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
      toastTimer = null;
    }, duration || 2000);
  }

  function fallbackCopy(text) {
    return new Promise(function (resolve) {
      var textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.top = '-9999px';
      textarea.style.left = '-9999px';
      textarea.style.opacity = '0';
      textarea.setAttribute('readonly', '');
      document.body.appendChild(textarea);
      textarea.select();
      textarea.setSelectionRange(0, textarea.value.length);
      var success = false;
      try { success = document.execCommand('copy'); } catch (e) { success = false; }
      document.body.removeChild(textarea);
      resolve(success);
    });
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () {
        return true;
      }).catch(function () {
        return fallbackCopy(text);
      });
    }
    return fallbackCopy(text);
  }

  copyBtns.forEach(function (btn) {
    var btnText = btn.querySelector('.btn-text');
    var defaultText = btnText.textContent;
    var restoreTimer = null;
    var failTimer = null;

    btn.addEventListener('click', function () {
      var textToCopy = btn.getAttribute('data-copy') || '';

      btn.disabled = true;
      btn.style.opacity = '0.8';

      copyText(textToCopy).then(function (success) {
        if (success) {
          btn.classList.add('copied');
          btnText.textContent = '已复制!';
          showToast('✅ ' + defaultText + '已复制', 2000);

          if (restoreTimer) clearTimeout(restoreTimer);
          restoreTimer = setTimeout(function () {
            btnText.textContent = defaultText;
            btn.classList.remove('copied');
            restoreTimer = null;
          }, 2000);
        } else {
          showToast('❌ 复制失败，请手动复制', 2000);
          btnText.textContent = '复制失败';
          if (failTimer) clearTimeout(failTimer);
          failTimer = setTimeout(function () {
            btnText.textContent = defaultText;
            failTimer = null;
          }, 2000);
        }
      }).catch(function () {
        showToast('❌ 复制失败，请稍后重试', 2000);
        btnText.textContent = defaultText;
      }).finally(function () {
        btn.disabled = false;
        btn.style.opacity = '1';
      });
    });
  });
})();
</script>

</body>
</html>
