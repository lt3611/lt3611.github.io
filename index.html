<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自用导航 - 链接集合</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(145deg, #f8faff 0%, #eef2f9 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
  }

  .card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 24px;
    padding: 32px 20px;
    box-shadow: 0 25px 40px -12px rgba(0, 20, 60, 0.25),
                inset 0 1px 2px rgba(255, 255, 255, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    max-width: 500px; /* 控制卡片宽度，刚好容纳 3 列 */
    width: 100%;
  }

  .title {
    font-size: 24px;
    font-weight: 600;
    color: #1f2a4a;
    text-align: center;
  }

  .title span {
    background: linear-gradient(135deg, #3b5bdb, #8b5cf6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub {
    font-size: 14px;
    color: #4b587c;
    text-align: center;
    margin-top: -10px;
  }

  /* ===== 主页按钮 ===== */
  .home-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 15px 20px;
    border-radius: 60px;
    background: linear-gradient(135deg, #3b5bdb, #8b5cf6);
    color: #fff;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.01em;
    text-decoration: none;
    white-space: nowrap;
    box-shadow: 0 10px 20px -8px rgba(59, 91, 219, 0.5),
                0 4px 10px rgba(59, 91, 219, 0.15),
                inset 0 1px 1px rgba(255, 255, 255, 0.25);
    transition: transform 0.15s ease, box-shadow 0.25s ease, filter 0.25s ease;
    -webkit-tap-highlight-color: transparent;
    margin-bottom: 4px;
  }

  .home-btn:hover { transform: translateY(-1px); filter: brightness(1.05); }
  .home-btn:active { transform: translateY(1px); }

  .home-btn svg {
    width: 18px; height: 18px; flex-shrink: 0;
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }

  /* ===== 三列网格容器 ===== */
  .grid-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr); /* 严格 3 列 */
    gap: 12px 10px;
    width: 100%;
    margin-top: 4px;
  }

  /* ===== 按钮统一基础样式 ===== */
  .action-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 46px;
    border-radius: 60px;
    color: #fff;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.01em;
    white-space: nowrap;
    text-decoration: none;
    cursor: pointer;
    border: none;
    outline: none;
    font-family: inherit;
    transition: transform 0.15s ease, box-shadow 0.25s ease, filter 0.25s ease, background 0.25s ease;
    -webkit-tap-highlight-color: transparent;
    padding: 0 4px;
  }

  /* 左中列（跳转网址）按钮样式 - 紫蓝渐变 */
  .link-btn {
    background: linear-gradient(135deg, #4b6df0, #8b5cf6);
    box-shadow: 0 6px 16px -6px rgba(59, 91, 219, 0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
  }

  .link-btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .link-btn:active { transform: translateY(1px); }

  /* 右列（复制链接）按钮样式 - 深色 */
  .copy-btn {
    background: #1a2b4c;
    box-shadow: 0 6px 16px -6px rgba(26, 43, 76, 0.4),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
  }

  .copy-btn:hover { background: #233a62; transform: translateY(-1px); }
  .copy-btn:active { transform: translateY(1px); background: #16233d; }

  /* 图标统一尺寸 */
  .action-btn svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* 复制成功状态 */
  .copy-btn.copied {
    background: #2b6e4f;
    box-shadow: 0 6px 16px -6px rgba(43, 110, 79, 0.5);
  }
  .copy-btn.copied:hover { background: #2f7a58; }

  /* Toast */
  .toast-message {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: #1e293b;
    color: #f1f5f9;
    padding: 12px 28px;
    border-radius: 60px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.4);
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.25s ease;
    pointer-events: none;
    z-index: 9999;
    white-space: nowrap;
  }
  .toast-message.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 380px) {
    .grid-container { gap: 10px 6px; }
    .action-btn { height: 42px; font-size: 12px; }
    .action-btn svg { width: 12px; height: 12px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="title"><span>自用导航</span> 链接集合</div>

  <!-- 主页按钮 -->
  <a class="home-btn" id="homeBtn" href="#" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24">
      <path d="M3 9.5L12 3l9 6.5"/>
      <path d="M5 10v10h14V10"/>
      <path d="M9 20v-6h6v6"/>
    </svg>
    <span>主页</span>
  </a>

  <p class="sub">左中列点击跳转，右列点击复制</p>

  <!-- 3列网格容器 -->
  <div class="grid-container" id="gridContainer"></div>
</div>

<div class="toast-message" id="toast">✅ 链接已复制</div>

<script>
(function () {
  'use strict';

  // ==========================================
  // ⬇️ 数据配置区（每一行代表页面上的三个按钮） ⬇️
  // ==========================================
  
  const HOME_URL = 'https://lt3611.ccwu.cc/';

  // 数组的每一项，会自动渲染成：左边紫蓝 + 中间紫蓝 + 右边深色
  const rowData = [
    // 第一排
    {
      leftText: '日历', 
      middleText: '路由', 
      rightText: '常用接口',
      leftUrl: 'https://lt3611.ccwu.cc/tools/tq.html', // ✅ 修复了这里的错误
      middleUrl: 'https://192.168.50.1',
      rightUrl: 'https://lt3611.ccwu.cc/tools/tv.txt'
    },
    // 第二排
    {
      leftText: 'Cloudflare', 
      middleText: '路由查看', 
      rightText: '电视导航',
      leftUrl: 'https://www.cloudflare.com/',
      middleUrl: 'https://192.168.50.1:9990/ui/zashboard/#/setup?hostname=192.168.50.1&port=9990&secret=clash',
      rightUrl: 'https://lt3611.ccwu.cc/tools/tv3.txt'
    },
    // 第三排
    {
      leftText: '52pojie', 
      middleText: '电视', 
      rightText: '学习导航',
      leftUrl: 'https://www.52pojie.cn/forum.php?mod=forumdisplay&fid=16&filter=typeid&typeid=232',
      middleUrl: 'https://lt3611.ccwu.cc',
      rightUrl: 'https://lt3611.ccwu.cc/tools/tv1.txt'
    },
    // 第四排 (如果您需要加，就照着格式往下写)
    {
      leftText: 'A3转A4', 
      middleText: '开始4', 
      rightText: '调试导航',
      leftUrl: 'https://lt3611.ccwu.cc/tools/pdf.html',
      middleUrl: 'https://lt3611.ccwu.cc',
      rightUrl: 'https://lt3611.ccwu.cc/tools/tv2.txt'
    }
  ];

  // ==========================================
  // ⬇️ 以下是自动生成和交互逻辑，通常不需要修改 ⬇️
  // ==========================================

  const homeBtn = document.getElementById('homeBtn');
  if (homeBtn) homeBtn.href = HOME_URL;

  const gridContainer = document.getElementById('gridContainer');
  
  // 网址图标 SVG
  const linkSvg = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8"/><path d="M3.6 15h16.8"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></svg>`;
  
  // 复制图标 SVG
  const copySvg = `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;

  // 循环生成 HTML
  let htmlContent = '';
  rowData.forEach((item) => {
    // 1. 左侧跳转按钮
    htmlContent += `
      <a class="action-btn link-btn" href="${item.leftUrl}" target="_blank" rel="noopener">
        ${linkSvg}
        <span>${item.leftText}</span>
      </a>
    `;
    // 2. 中间跳转按钮
    htmlContent += `
      <a class="action-btn link-btn" href="${item.middleUrl}" target="_blank" rel="noopener">
        ${linkSvg}
        <span>${item.middleText}</span>
      </a>
    `;
    // 3. 右侧复制按钮
    htmlContent += `
      <button class="action-btn copy-btn" data-copy="${item.rightUrl}">
        ${copySvg}
        <span class="btn-text">${item.rightText}</span>
      </button>
    `;
  });

  gridContainer.innerHTML = htmlContent;

  // ===== 复制逻辑 =====
  var toastEl = document.getElementById('toast');
  var copyBtns = document.querySelectorAll('.copy-btn');
  var toastTimer = null;

  function showToast(message, duration) {
    if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
    toastEl.textContent = message;
    toastEl.classList.add('show');
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
      toastTimer = null;
    }, duration || 2000);
  }

  function fallbackCopy(text) {
    return new Promise(function (resolve) {
      var textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.top = '-9999px';
      textarea.style.left = '-9999px';
      textarea.style.opacity = '0';
      textarea.setAttribute('readonly', '');
      document.body.appendChild(textarea);
      textarea.select();
      textarea.setSelectionRange(0, textarea.value.length);
      var success = false;
      try { success = document.execCommand('copy'); } catch (e) { success = false; }
      document.body.removeChild(textarea);
      resolve(success);
    });
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () {
        return true;
      }).catch(function () {
        return fallbackCopy(text);
      });
    }
    return fallbackCopy(text);
  }

  copyBtns.forEach(function (btn) {
    var btnText = btn.querySelector('.btn-text');
    var defaultText = btnText.textContent;
    var restoreTimer = null;
    var failTimer = null;

    btn.addEventListener('click', function () {
      var textToCopy = btn.getAttribute('data-copy') || '';

      btn.disabled = true;
      btn.style.opacity = '0.8';

      copyText(textToCopy).then(function (success) {
        if (success) {
          btn.classList.add('copied');
          btnText.textContent = '已复制!';
          showToast('✅ ' + defaultText + '已复制', 2000);

          if (restoreTimer) clearTimeout(restoreTimer);
          restoreTimer = setTimeout(function () {
            btnText.textContent = defaultText;
            btn.classList.remove('copied');
            restoreTimer = null;
          }, 2000);
        } else {
          showToast('❌ 复制失败，请手动复制', 2000);
          btnText.textContent = '复制失败';
          if (failTimer) clearTimeout(failTimer);
          failTimer = setTimeout(function () {
            btnText.textContent = defaultText;
            failTimer = null;
          }, 2000);
        }
      }).catch(function () {
        showToast('❌ 复制失败，请稍后重试', 2000);
        btnText.textContent = defaultText;
      }).finally(function () {
        btn.disabled = false;
        btn.style.opacity = '1';
      });
    });
  });
})();
</script>

</body>
</html>
